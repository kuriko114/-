<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pocket Virtual Pet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --shell-color: #ffb7c5;
      --shell-border: #f28b9f;
      --screen-bg: #cadc9f;
      --screen-pixel: #1f3c1d;
      --btn-color: #ffeef2;
      --btn-shadow: #d88395;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #fcefee 0%, #dbe7e4 100%);
      font-family: 'VT323', monospace;
      padding: 10px;
    }

    .tamagotchi-shell {
      width: 100%;
      max-width: 350px;
      height: 490px;
      background: var(--shell-color);
      border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
      border: 8px solid var(--shell-border);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.15), inset 0 -8px 12px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      position: relative;
    }

    .brand-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      margin-bottom: 6px;
    }

    .brand-title {
      font-size: 20px;
      color: #9c4d5d;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .reset-link {
      font-size: 14px;
      color: #b05c6d;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px;
    }

    .screen-bezel {
      width: 250px;
      height: 230px;
      background: #7a8a64;
      border-radius: 12px;
      padding: 10px;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .lcd-screen {
      width: 100%;
      height: 100%;
      background: var(--screen-bg);
      border-radius: 6px;
      border: 2px solid var(--screen-pixel);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px;
      color: var(--screen-pixel);
      overflow: hidden;
    }

    .top-status {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      border-bottom: 1px dashed var(--screen-pixel);
      padding-bottom: 2px;
    }

    .viewport {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .character {
      font-size: 52px;
      line-height: 1;
      animation: bounce 1.2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .wobble {
      animation: wobbleAnim 0.35s ease-in-out !important;
    }

    @keyframes wobbleAnim {
      0% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.2) rotate(-15deg); }
      75% { transform: scale(1.2) rotate(15deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .sleeping {
      filter: grayscale(0.5);
      animation: none !important;
    }

    /* 訊息提示框 */
    .msg-bar {
      position: absolute;
      top: 28px;
      left: 6px;
      right: 6px;
      background: #ffffff;
      color: #1f3c1d;
      border: 2px solid #1f3c1d;
      padding: 3px 6px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      text-align: center;
      box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.3);
      z-index: 50;
      transition: opacity 0.2s ease;
    }

    .poop-zone {
      position: absolute;
      right: 6px;
      bottom: 4px;
      font-size: 18px;
      letter-spacing: -2px;
      pointer-events: none;
    }

    .stat-bars {
      font-size: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px 8px;
      border-top: 1px dashed var(--screen-pixel);
      padding-top: 3px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
    }

    .lights-off-overlay {
      position: absolute;
      inset: 0;
      background: rgba(18, 30, 16, 0.92);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      z-index: 40;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 20px;
      padding: 0 4px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .game-btn {
      width: 48px;
      height: 48px;
      background: var(--btn-color);
      border: 2px solid var(--btn-shadow);
      border-radius: 50%;
      box-shadow: 0 4px 0 var(--btn-shadow), 0 5px 6px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      outline: none;
      touch-action: manipulation;
    }

    .game-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--btn-shadow);
    }

    .btn-label {
      font-size: 13px;
      color: #7b3e4b;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="tamagotchi-shell">
    <div class="brand-header">
      <span class="brand-title">✧ PETIT FRIEND ✧</span>
      <span class="reset-link" id="btnReset">重置</span>
    </div>

    <div class="screen-bezel">
      <div class="lcd-screen">
        <div class="lights-off-overlay" id="sleepOverlay">zzz...</div>

        <div class="top-status">
          <span id="stageLabel">STAGE: 蛋</span>
          <span id="ageLabel">AGE: 0歲</span>
        </div>

        <div class="viewport" id="viewport">
          <div class="msg-bar" id="msgBar">點擊蛋可以加速孵化！</div>
          <div class="character" id="petChar">🥚</div>
          <div class="poop-zone" id="poopZone"></div>
        </div>

        <div class="stat-bars">
          <div class="stat-item">飽足: <span id="valHunger">100%</span></div>
          <div class="stat-item">心情: <span id="valHappy">100%</span></div>
          <div class="stat-item">精力: <span id="valEnergy">100%</span></div>
          <div class="stat-item">健康: <span id="valHealth">100%</span></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="btn-group">
        <button class="game-btn" data-act="feed">🍚</button>
        <span class="btn-label">餵食</span>
      </div>
      <div class="btn-group">
        <button class="game-btn" data-act="play">🎮</button>
        <span class="btn-label">玩耍</span>
      </div>
      <div class="btn-group">
        <button class="game-btn" data-act="clean">✨</button>
        <span class="btn-label">打掃</span>
      </div>
      <div class="btn-group">
        <button class="game-btn" data-act="sleep">💡</button>
        <span class="btn-label">燈光</span>
      </div>
      <div class="btn-group">
        <button class="game-btn" data-act="heal">💊</button>
        <span class="btn-label">看病</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const SAVE_KEY = 'petit_pet_save_v3';
      let state = {
        hunger: 100,
        happy: 100,
        energy: 100,
        health: 100,
        poopCount: 0,
        ageSeconds: 0,
        isSleeping: false,
        isDead: false,
        stage: 0, // 0:蛋, 1:幼體, 2:成長期, 3:完全體
        lastTime: Date.now()
      };

      // 載入存檔
      const saved = localStorage.getItem(SAVE_KEY);
      if (saved) {
        try {
          state = Object.assign(state, JSON.parse(saved));
        } catch(e) {}
      }

      const els = {
        petChar: document.getElementById('petChar'),
        msgBar: document.getElementById('msgBar'),
        poopZone: document.getElementById('poopZone'),
        stageLabel: document.getElementById('stageLabel'),
        ageLabel: document.getElementById('ageLabel'),
        valHunger: document.getElementById('valHunger'),
        valHappy: document.getElementById('valHappy'),
        valEnergy: document.getElementById('valEnergy'),
        valHealth: document.getElementById('valHealth'),
        sleepOverlay: document.getElementById('sleepOverlay'),
        viewport: document.getElementById('viewport'),
        btnReset: document.getElementById('btnReset')
      };

      let msgTimer = null;
      function showMsg(text) {
        els.msgBar.innerText = text;
        els.msgBar.style.opacity = '1';
        clearTimeout(msgTimer);
        msgTimer = setTimeout(() => {
          els.msgBar.style.opacity = '0';
        }, 2200);
      }

      function wobble() {
        els.petChar.classList.remove('wobble');
        void els.petChar.offsetWidth;
        els.petChar.classList.add('wobble');
      }

      function render() {
        if (state.isDead) {
          els.petChar.innerText = '🪦';
          els.stageLabel.innerText = 'STAGE: 天使';
        } else {
          switch(state.stage) {
            case 0: els.petChar.innerText = '🥚'; els.stageLabel.innerText = 'STAGE: 蛋'; break;
            case 1: els.petChar.innerText = '🐣'; els.stageLabel.innerText = 'STAGE: 幼體'; break;
            case 2: els.petChar.innerText = state.health < 40 ? '🤕' : '🐥'; els.stageLabel.innerText = 'STAGE: 成長期'; break;
            case 3: els.petChar.innerText = state.health < 40 ? '🧟' : '🦖'; els.stageLabel.innerText = 'STAGE: 完全體'; break;
          }
        }

        if (state.isSleeping) {
          els.petChar.classList.add('sleeping');
        } else {
          els.petChar.classList.remove('sleeping');
        }

        els.ageLabel.innerText = `AGE: ${Math.floor(state.ageSeconds / 60)}歲`;
        els.valHunger.innerText = `${Math.round(state.hunger)}%`;
        els.valHappy.innerText = `${Math.round(state.happy)}%`;
        els.valEnergy.innerText = `${Math.round(state.energy)}%`;
        els.valHealth.innerText = `${Math.round(state.health)}%`;
        els.poopZone.innerText = '💩'.repeat(state.poopCount);
        els.sleepOverlay.style.display = state.isSleeping ? 'flex' : 'none';

        state.lastTime = Date.now();
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      }

      function tick() {
        if (state.isDead) return;
        state.ageSeconds += 1;

        // 進化判斷
        if (state.stage === 0 && state.ageSeconds >= 10) {
          state.stage = 1;
          wobble();
          showMsg('🐣 蛋孵化出來了！');
        } else if (state.stage === 1 && state.ageSeconds >= 60) {
          state.stage = 2;
          wobble();
          showMsg('🐥 寵物進化了！');
        } else if (state.stage === 2 && state.ageSeconds >= 180) {
          state.stage = 3;
          wobble();
          showMsg('🦖 變成完全體！');
        }

        if (state.stage > 0 && state.ageSeconds % 3 === 0) {
          if (state.isSleeping) {
            state.energy = Math.min(100, state.energy + 3);
            state.hunger = Math.max(0, state.hunger - 0.5);
          } else {
            state.hunger = Math.max(0, state.hunger - 1);
            state.happy = Math.max(0, state.happy - 1);
            state.energy = Math.max(0, state.energy - 0.5);
          }

          if (!state.isSleeping && Math.random() < 0.15 && state.poopCount < 4) {
            state.poopCount += 1;
            showMsg('💩 該打掃了！');
          }

          if (state.poopCount > 0) state.health = Math.max(0, state.health - state.poopCount);
          if (state.hunger === 0 || state.energy === 0) state.health = Math.max(0, state.health - 2);

          if (state.health <= 0) {
            state.isDead = true;
            state.isSleeping = false;
            showMsg('🪦 寵物離世了...');
          }
        }
        render();
      }

      function handleAction(action) {
        wobble();
        if (state.isDead) {
          showMsg('請點右上角重置重新開始');
          return;
        }

        if (state.stage === 0) {
          showMsg('蛋還沒孵化喔！(點蛋加速)');
          return;
        }

        if (state.isSleeping && action !== 'sleep') {
          showMsg('正在睡覺中 zzZ');
          return;
        }

        switch(action) {
          case 'feed':
            if (state.hunger >= 100) {
              showMsg('已經吃很飽了~');
            } else {
              state.hunger = Math.min(100, state.hunger + 25);
              state.health = Math.min(100, state.health + 2);
              showMsg('好吃！(๑´ڡ`๑)');
            }
            break;

          case 'play':
            if (state.energy < 15) {
              showMsg('太累了，動不了...');
            } else {
              state.happy = Math.min(100, state.happy + 20);
              state.energy = Math.max(0, state.energy - 10);
              state.hunger = Math.max(0, state.hunger - 5);
              showMsg('好玩！(≧▽≦)');
            }
            break;

          case 'clean':
            if (state.poopCount === 0) {
              showMsg('環境很乾淨喔！✨');
            } else {
              state.poopCount = 0;
              state.happy = Math.min(100, state.happy + 10);
              showMsg('乾淨溜溜！🧹');
            }
            break;

          case 'sleep':
            state.isSleeping = !state.isSleeping;
            showMsg(state.isSleeping ? '晚安...' : '早安！☀️');
            break;

          case 'heal':
            if (state.health >= 90) {
              showMsg('身體非常健康！');
            } else {
              state.health = Math.min(100, state.health + 35);
              showMsg('打針康復了！💊');
            }
            break;
        }
        render();
      }

      // 點擊螢幕/蛋加速
      els.viewport.addEventListener('click', () => {
        wobble();
        if (state.stage === 0) {
          state.ageSeconds += 2;
          const left = Math.max(0, 10 - state.ageSeconds);
          showMsg(left > 0 ? `蛋在晃動！(剩${left}秒)` : '要破殼了！');
          render();
        } else if (!state.isSleeping) {
          state.happy = Math.min(100, state.happy + 2);
          showMsg('❤ 摸摸~');
          render();
        }
      });

      // 按鈕綁定
      document.querySelectorAll('.game-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const act = btn.getAttribute('data-act');
          handleAction(act);
        });
      });

      // 重置
      els.btnReset.addEventListener('click', () => {
        if (confirm('要重新開始養新的一顆蛋嗎？')) {
          localStorage.removeItem(SAVE_KEY);
          state = {
            hunger: 100, happy: 100, energy: 100, health: 100,
            poopCount: 0, ageSeconds: 0, isSleeping: false, isDead: false,
            stage: 0, lastTime: Date.now()
          };
          showMsg('✨ 新生命開始！');
          render();
        }
      });

      render();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
